<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração de quadra esportiva iluminada à noite">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03110A"/>
      <stop offset="55%" stop-color="#071B12"/>
      <stop offset="100%" stop-color="#0C2A1B"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123321"/>
      <stop offset="100%" stop-color="#0A2216"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFFEA" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#8CFFB0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8CFFB0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fence" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#4ADE80" stroke-opacity="0.14" stroke-width="1"/>
      <line x1="0" y1="0" x2="22" y2="0" stroke="#4ADE80" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050F0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050F0A" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#skyGrad)"/>

  <!-- distant tree line -->
  <g opacity="0.5" fill="#08160F">
    <path d="M0 560 L60 500 L120 545 L190 470 L260 540 L330 495 L400 555 L470 505 L540 550 L1600 550 L1600 1000 L0 1000 Z"/>
  </g>

  <!-- court floor -->
  <rect x="0" y="560" width="1600" height="440" fill="url(#floorGrad)"/>

  <!-- court lines, perspective -->
  <g stroke="#B9F6C8" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M120 990 L520 590"/>
    <path d="M1480 990 L1080 590"/>
    <path d="M330 990 Q800 900 1270 990"/>
    <path d="M470 780 Q800 730 1130 780"/>
    <circle cx="800" cy="705" r="70" opacity="0.5"/>
  </g>

  <!-- fence -->
  <rect x="0" y="120" width="1600" height="500" fill="url(#fence)"/>
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#4ADE80" stroke-opacity="0.25" stroke-width="4"/>
  <line x1="0" y1="620" x2="1600" y2="620" stroke="#4ADE80" stroke-opacity="0.25" stroke-width="4"/>

  <!-- fence posts -->
  <g fill="#0A2013">
    <rect x="70" y="110" width="14" height="520"/>
    <rect x="470" y="110" width="14" height="520"/>
    <rect x="1120" y="110" width="14" height="520"/>
    <rect x="1520" y="110" width="14" height="520"/>
  </g>

  <!-- floodlight poles + glow -->
  <g>
    <rect x="240" y="60" width="10" height="360" fill="#0A2013"/>
    <circle cx="245" cy="70" r="140" fill="url(#glow)"/>
    <rect x="240" y="55" width="46" height="16" rx="3" fill="#DFFFEA"/>

    <rect x="1340" y="90" width="10" height="330" fill="#0A2013"/>
    <circle cx="1345" cy="100" r="120" fill="url(#glow)"/>
    <rect x="1340" y="86" width="42" height="14" rx="3" fill="#DFFFEA"/>

    <rect x="820" y="30" width="10" height="330" fill="#0A2013"/>
    <circle cx="825" cy="40" r="150" fill="url(#glow)"/>
    <rect x="820" y="25" width="46" height="16" rx="3" fill="#DFFFEA"/>
  </g>

  <!-- banner -->
  <g>
    <rect x="640" y="420" width="330" height="150" rx="4" fill="#0E2818" stroke="#4ADE80" stroke-opacity="0.4"/>
    <text x="660" y="480" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#F4F7F2">QUADRA</text>
    <text x="660" y="530" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#5CFF7E">LIVRE</text>
  </g>

  <rect width="1600" height="1000" fill="url(#fadeBottom)" opacity="0.55"/>
</svg>
