    <radialGradient id="glow5" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#DFFFEA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8CFFB0" stop-opacity="0"/>
