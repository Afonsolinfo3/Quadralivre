    <path d="M215 380 C215 290 250 255 280 255 C310 255 345 290 345 380 Z"/>
    <path d="M330 380 C330 285 368 250 300 250 C300 250 300 250 300 250"/>
    <path d="M330 380 C330 285 368 250 400 250 C432 250 470 285 470 380 Z"/>
    <path d="M395 380 C395 300 425 270 450 270 C475 270 505 300 505 380 Z"/>
    <circle cx="175" cy="255" r="26"/>
    <circle cx="280" cy="238" r="28"/>
    <circle cx="400" cy="233" r="29"/>
    <circle cx="450" cy="255" r="26"/>
  </g>
  <!-- connecting arms as soft shapes -->
  <g fill="#04120B" opacity="0.9">
    <rect x="195" y="290" width="55" height="16" rx="8"/>
    <rect x="300" y="278" width="60" height="16" rx="8"/>
